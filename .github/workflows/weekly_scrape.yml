name: Weekly scrape and load

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  scrape-and-load:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pandas sqlalchemy psycopg2-binary playwright
          playwright install chromium

      - name: Run scraper
        run: |
          cd scraper
          python pipeline.py

      - name: Run loader
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd scraper
          python load.py
      - name: Upload scraping results
        uses: actions/upload-artifact@v4
        with:
          name: scraping-results
          path: data/raw/vacancies_all.json